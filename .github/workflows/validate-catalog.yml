name: Validate Audit Catalog

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Validate inventory generation and catalog coverage
        run: |
          python scripts/generate-inventory.py
          python -m unittest discover -s scripts -p 'test_*.py'
          git diff --exit-code -- AUDIT-INVENTORY.csv
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: audit-browser/package-lock.json
      - run: npm ci
        working-directory: audit-browser
      - run: npm run build:static
        working-directory: audit-browser
        env:
          AUDITS_BASE_PATH: ${{ github.workspace }}
